# Pinned Rust toolchain for contributors and rustup users.
#
# This is **not** what the release is built with: the release takes its
# toolchain from the certified nixpkgs revision recorded in nix/release-rows,
# and the version it used is recorded per row in nix/release-manifests/.  The
# rule that the release compiler equals the MSRV compiler is retired -- MSRV is
# a claim about what *source* compiles, enforced by testing.
#
# `channel` tracks `package.rust-version` in Cargo.toml; bump both together.
[toolchain]
channel = "1.85.0"
profile = "minimal"
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "armv7-unknown-linux-gnueabihf",
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-musl",
    "armv7-unknown-linux-musleabihf",
]
